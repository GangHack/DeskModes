name: Bug report
description: Report a problem with startup, switching or the interface
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Tell us what went wrong. Diagnostics and a short log excerpt help, but
        you can report a problem even if DeskModes will not start.
        This issue is public: review attachments and redact private information.

  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      placeholder: Selected Work. Both displays came up, but the taskbar stayed on the wrong one.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      description: List the steps. If it only happened once, describe what you did before it happened.
      placeholder: |
        1. Start Displays.cmd.
        2. Select Work from the tray menu.
        3. Check the taskbar display.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: DeskModes version
      description: See Settings → About or the release ZIP name. Write "unknown" if unavailable.
      placeholder: 1.0.1
    validations:
      required: true

  - type: textarea
    id: status
    attributes:
      label: Diagnostics (optional)
      description: >
        Run diagnostics.cmd for a fresh snapshot, or use Settings → About → Copy diagnostics.
        It includes versions and display modes, without settings, hooks, full device paths or diary data.
        Review it before posting. If the app will not start, paste the error message instead.
      render: text

  - type: textarea
    id: log
    attributes:
      label: Log excerpt (optional)
      description: >
        Open log from the tray and copy only the relevant lines from last-run.log.
        Logs may contain hook commands and local paths. Remove names, tokens and other private information.
      render: text

  - type: textarea
    id: desk
    attributes:
      label: Your display setup (optional)
      description: Monitor models, HDMI/DisplayPort/USB-C connections, graphics card, and any laptop or dock.

  - type: input
    id: often
    attributes:
      label: How often it happens (optional)
      placeholder: Every time / after waking from sleep / only once
