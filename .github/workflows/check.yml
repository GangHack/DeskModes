# The quality gates. The same .\tools\check.ps1 a person calls by hand — a second way of checking
# would establish a second truth about what counts as "green".
#
# shell: powershell is Windows PowerShell 5.1 on the runner, exactly the version the tool is written
# for. pwsh (7) would take a different engine, and the difference would surface not here but at the
# user's.
name: check

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # check.ps1 checks the line endings itself, so the checkout has to be the same as a
          # working copy: .gitattributes calls for CRLF, and the runner obeys it by default.
          fetch-depth: 1

      - name: PowerShell version
        shell: powershell
        run: $PSVersionTable | Format-List

      # The tool installs nothing into a user's system — but the runner is disposable, and the
      # analyzer is needed here, or the third gate would be silently skipped.
      #
      # The version is the same as in release.yml and is pinned there for the same reason: "latest"
      # changes a step's contents by itself, and the gates turn red without a single edit to the
      # code. Raise it in both files at once.
      - name: Install PSScriptAnalyzer
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -AllowClobber
          (Get-Module -ListAvailable PSScriptAnalyzer | Select-Object -First 1).Version.ToString()

      - name: Check
        shell: powershell
        run: .\tools\check.ps1 -RequireAnalyzer
