# Ворота качества. Тот же .\tools\check.ps1, что человек зовёт руками, — второй
# способ проверки завёл бы вторую правду о том, что считается «зелено».
#
# shell: powershell — это Windows PowerShell 5.1 на раннере, ровно та версия, под
# которую написан инструмент. pwsh (7) взял бы другой движок, и разница вылезла бы
# не здесь, а у пользователя.
name: check

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Концы строк проверяет сам check.ps1, поэтому выкладка обязана быть
          # такой же, как в рабочей копии: .gitattributes велит CRLF, а раннер по
          # умолчанию слушается его же.
          fetch-depth: 1

      - name: PowerShell version
        shell: powershell
        run: $PSVersionTable | Format-List

      # В систему пользователя инструмент ничего не ставит — а раннер одноразовый,
      # и здесь анализатор нужен, иначе третьи ворота молча пропускались бы.
      - name: Install PSScriptAnalyzer
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -AllowClobber
          (Get-Module -ListAvailable PSScriptAnalyzer | Select-Object -First 1).Version.ToString()

      - name: Check
        shell: powershell
        run: .\tools\check.ps1 -RequireAnalyzer
