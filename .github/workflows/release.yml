# Релиз собирается по тегу vX.Y.Z и никак иначе: тег — единственное осознанное
# действие человека, всё остальное здесь механика.
#
# Ворота не переписываются, а зовутся тем же .\tools\check.ps1, что и в check.yml
# и что человек зовёт руками: вторая формулировка того, что считается «зелено»,
# рано или поздно разойдётся с первой. Релиз без прогона ворот не собирается —
# именно он уезжает людям, и чинить его потом дороже всего.
#
# Работы две, и разнесены они намеренно. Ворота ставят PSScriptAnalyzer из
# PSGallery и исполняют его: check.ps1 делает Import-Module, то есть чужой код
# работает на раннере. Стой он в одной работе со сборкой, у него было бы право
# записи в дерево ДО того, как из этого дерева пакуется архив и считается его
# SHA256, — угнанный пакет уехал бы людям, а хэш на странице релиза сошёлся бы с
# подменённым содержимым. Инструмент не подписан, второго способа проверить у
# скачавшего нет. Поэтому та работа, что пакует и публикует, не ставит ничего:
# в ней исполняется только checkout, наш код и gh.
#
# shell: powershell — Windows PowerShell 5.1, та же версия, под которую написан
# инструмент. pwsh (7) взял бы другой движок.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# По умолчанию — только чтение. Право писать выдано одной работе из двух, и
# именно той, которая заводит релиз.
permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    # Тег — единственный законный повод собрать релиз. Ручной запуск с ветки дал бы
    # в GITHUB_REF_NAME «main», сверка версии упала бы уже после ворот, а страница
    # релиза завелась бы под именем ветки. Работе release своё условие не нужно:
    # пропуск той, от которой она зависит, пропускает и её.
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Версия закреплена: «последняя» означает, что содержимое шага меняется само
      # по себе — два прогона одного и того же тега получают разный анализатор, и
      # позеленевшие вчера ворота сегодня краснеют без единой правки в коде.
      - name: Install PSScriptAnalyzer
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -AllowClobber

      - name: Check
        shell: powershell
        run: .\tools\check.ps1 -RequireAnalyzer

  release:
    runs-on: windows-latest
    needs: check
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # -ExpectVersion ловит тег, поставленный без поднятия $script:Version:
      # архив уехал бы под чужим номером, а About внутри него говорил бы своё.
      - name: Pack
        shell: powershell
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          .\tools\pack.ps1 -ExpectVersion $version -NotesOut release-notes.md

      - name: Publish
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem -Path 'ScreenDeck-*.zip' | Select-Object -First 1
          gh release create $env:GITHUB_REF_NAME --verify-tag `
            $zip.FullName "$($zip.FullName).sha256" `
            --title "ScreenDeck $($env:GITHUB_REF_NAME -replace '^v', '')" `
            --notes-file release-notes.md
