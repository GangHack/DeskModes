# A release is built off a vX.Y.Z tag and no other way: the tag is the one deliberate act by a
# person, and everything else here is mechanics.
#
# The gates are not rewritten but called as the same .\tools\check.ps1 as in check.yml and as a
# person calls by hand: a second wording of what counts as "green" will sooner or later drift apart
# from the first. A release is not built without the gates being run — it is the release that goes
# out to people, and fixing it afterwards costs the most of all.
#
# There are two jobs, and they are kept apart deliberately. The gates install PSScriptAnalyzer from
# PSGallery and execute it: check.ps1 does an Import-Module, that is, somebody else's code runs on
# the runner. Were it in the same job as the build, it would have the right to write into the tree
# BEFORE the archive is packed out of that tree and its SHA256 worked out — a hijacked package would
# go out to people, and the hash on the release page would agree with the substituted contents. The
# tool is not signed, and whoever downloads it has no second way to check. So the job that packs and
# publishes installs nothing: only the checkout, our own code and gh run in it.
#
# shell: powershell — Windows PowerShell 5.1, the same version the tool is written for. pwsh (7)
# would take a different engine.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read-only by default. The right to write is granted to one job out of the two, and to the one that
# creates the release.
permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    # The tag is the only legitimate reason to build a release. A manual run from a branch would put
    # "main" into GITHUB_REF_NAME, the version check would fail after the gates had already run, and
    # the release page would be created under the branch's name. The release job needs no condition of
    # its own: skipping the one it depends on skips it too.
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The version is pinned: "latest" means a step's contents change by themselves — two runs of one
      # and the same tag get different analyzers, and gates that went green yesterday turn red today
      # without a single edit to the code.
      - name: Install PSScriptAnalyzer
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -AllowClobber

      - name: Check
        shell: powershell
        run: .\tools\check.ps1 -RequireAnalyzer

  release:
    runs-on: windows-latest
    needs: check
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # -ExpectVersion catches a tag set without $script:Version being bumped: the archive would leave
      # under somebody else's number, while the About inside it said its own.
      - name: Pack
        shell: powershell
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          .\tools\pack.ps1 -ExpectVersion $version -NotesOut release-notes.md

      - name: Publish
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem -Path 'ScreenDeck-*.zip' | Select-Object -First 1
          gh release create $env:GITHUB_REF_NAME --verify-tag `
            $zip.FullName "$($zip.FullName).sha256" `
            --title "ScreenDeck $($env:GITHUB_REF_NAME -replace '^v', '')" `
            --notes-file release-notes.md
